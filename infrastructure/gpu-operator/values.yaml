# Reviewed against the exact chart in chart.lock. No module or reboot manager.
kmm:
  enabled: false
  watch: false
remediation:
  enabled: false
  installCRDs: false
node-feature-discovery:
  enabled: true
  postDeleteCleanup: false
installdefaultNFDRule: true
