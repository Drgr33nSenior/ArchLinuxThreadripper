# Reviewed against the exact chart in chart.lock. No module or reboot manager.
kmm:
  enabled: false
  watch: false
remediation:
  enabled: false
  installCRDs: false
node-feature-discovery:
  enabled: true
  postDeleteCleanup: false
  # Same bundled NFD version; Linux/amd64 manifest for this bare-metal profile.
  image:
    repository: registry.k8s.io/nfd/node-feature-discovery
    tag: v0.18.3@sha256:7a9c4d658013e250d166704b81122e53a6b139f83de36be15a96884e8bcf7977
installdefaultNFDRule: true
# CRD upgrades are a reviewed lifecycle operation, never a chart side effect.
upgradeCRD: false
crds:
  defaultCR:
    install: false
    upgrade: false
draDriver:
  deviceClass:
    create: false
defaultDCMConfigMap:
  install: false
controllerManager:
  manager:
    image:
      repository: docker.io/rocm/gpu-operator
      tag: v1.5.1@sha256:572243df68701bd9f239820966ac333b75bf02182cb930ab7ef4bcc9232948e8
    imagePullPolicy: IfNotPresent
