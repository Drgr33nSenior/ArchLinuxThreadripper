# AI serving stack pins. Every component tracks upstream main: refresh.sh
# rewrites this file from the current heads, and builds use only these values.
# This is separate from versions.lock, which pins the host's packaged ROCm.
# Refreshed 2026-11-08.
GPU_TARGET=gfx1201
THEROCK_REPOSITORY=https://github.com/ROCm/TheRock.git
THEROCK_COMMIT=4c7aaf53cef968be9a7cd2eac4630b474a5446ec
# TheRock CI's own build container at that commit (manylinux_2_28 based).
THEROCK_BUILD_IMAGE=ghcr.io/rocm/therock_build_manylinux_x86_64@sha256:f1f9dd9b20404c239f01a02ffec61d6c2e80abcafe7fdac854f06169828e53ce
# Python for the PyTorch and serving stages (from the build image's /opt/python).
PYTHON_ABI=cp314-cp314
PYTORCH_REPOSITORY=https://github.com/pytorch/pytorch.git
PYTORCH_COMMIT=cba4a42aa487a7222d612ea4f402e857c028d607
TORCHVISION_REPOSITORY=https://github.com/pytorch/vision.git
TORCHVISION_COMMIT=4260301135e34180d865426765487113f84e7707
# Triton is the commit PyTorch pins (.ci/docker/ci_commit_pins/triton.txt),
# built from ROCm/triton as TheRock does; recorded here for the receipt.
TRITON_REPOSITORY=https://github.com/ROCm/triton.git
TRITON_COMMIT=b7ddcf86c095de79527ba3098503e73158bb94bd
SGLANG_REPOSITORY=https://github.com/sgl-project/sglang.git
SGLANG_COMMIT=fcb3274646e43c16d70fd83806ebb3a5134d5e81
# Content hash of the serving repository's serving/patches/sglang-main series
# (patchset-hash.sh); sync.sh copies that series to the build host.
SGLANG_PATCHSET_SHA256=d9af3651b8857720c996ec27c4341437c1ef80a78cc49cf0eb14536a8565f9cd
# refresh.sh resolves RUNTIME_BASE_TAG to the digest in RUNTIME_BASE_IMAGE.
RUNTIME_BASE_TAG=docker.io/library/python:3.14-slim-trixie
RUNTIME_BASE_IMAGE=docker.io/library/python@sha256:9aaa474097d094040649f2162a627c0049b408f52138d980916788d80f04802f
IMAGE_REPOSITORY=registry.lan.thespry.family/local/sglang-gfx1201
# Image generation (SwarmUI + its self-started ComfyUI) on the same ROCm and
# PyTorch build. Both track their default branch (master); refresh.sh moves them.
SWARMUI_REPOSITORY=https://github.com/mcmonkeyprojects/SwarmUI.git
SWARMUI_COMMIT=70b9a9c7885b5538450cf853bb7cdc36437d1ab4
COMFYUI_REPOSITORY=https://github.com/Comfy-Org/ComfyUI.git
COMFYUI_COMMIT=0228a9d73cd7c2daf8f61fe13d56b12efe307171
# SwarmUI builds with the .NET 10 SDK (self-contained); pinned by review.
# Tag 10.0.404-noble (manifest list, amd64 included).
DOTNET_SDK_IMAGE=mcr.microsoft.com/dotnet/sdk@sha256:fe0fd4e93bd2fbb47c883b7a6369e5c8d3db8bf01cdc5981f6ee35fbdf3ff4fb
CREATIVE_IMAGE_REPOSITORY=registry.lan.thespry.family/local/creative-gfx1201
# Graphiti memory service (infrastructure/graphiti), built by the graphiti stage.
GRAPHITI_IMAGE_REPOSITORY=registry.lan.thespry.family/local/graphiti-memory
GAMING_IMAGE_REPOSITORY=registry.lan.thespry.family/local/steam-headless
# Open WebUI from the workstation fork, built by the webui stage: an upstream release plus
# provider-declared Model Controls (the reasoning slider), offered upstream, and a group
# permission that lifts the web search confirmation. refresh.sh moves
# the commit to the branch head; rebasing the branch onto a new upstream release is reviewed by hand.
OPEN_WEBUI_FORK_REPOSITORY=https://github.com/Drgr33nSenior/open-webui.git
OPEN_WEBUI_FORK_BRANCH=workstation/reasoning-controls
OPEN_WEBUI_FORK_COMMIT=2cd8ab0d79f95cbf6c869e8699a5475038e73e68
OPEN_TERMINAL_COMMIT=d0301c5d633a176631cd36a4adf7fcc26bb38402
TERMINALS_COMMIT=4c7a747634d7a521ecc82f6f09dab204a3ded60e
SANDBOX_IMAGE_REPOSITORY=registry.lan.thespry.family/local/assistant-sandbox
PLAYWRIGHT_VERSION=1.65.2
WEBUI_IMAGE_REPOSITORY=registry.lan.thespry.family/local/open-webui
# AMD GPU DRA driver (the GPU operator's draDriver), built by the dra stage from upstream main.
# refresh.sh moves the commit to main's head and the Go image to the golang release upstream's
# env.mk names at that commit (GOLANG_VERSION); the build stops if the two disagree.
DRA_DRIVER_REPOSITORY=https://github.com/ROCm/k8s-gpu-dra-driver.git
DRA_DRIVER_COMMIT=8bf83533ad07a5f82c525692fef9547a64e8ba6e
DRA_GO_IMAGE=docker.io/library/golang:1.26.7-trixie@sha256:978084e7adea0904b6d76cbc9afcb9baeed6ee170eecdc8866566aaa9f22ad0c
# refresh.sh resolves DRA_RUNTIME_BASE_TAG to the digest in DRA_RUNTIME_BASE_IMAGE (same glibc as the Go image).
DRA_RUNTIME_BASE_TAG=docker.io/library/debian:trixie-slim
DRA_RUNTIME_BASE_IMAGE=docker.io/library/debian@sha256:a72b4433de1cf7d6bae0c4cee74d0547f58601a643b3375f070c51600d63b6b2
DRA_IMAGE_REPOSITORY=registry.lan.thespry.family/local/k8s-gpu-dra-driver
# Supply-chain tools, pinned by digest and upgraded by review (refresh.sh
# leaves them unchanged). Releases at least two weeks old when pinned.
COSIGN_IMAGE=ghcr.io/sigstore/cosign/cosign:v3.1.4@sha256:0f06154836d2de34f887a5c273506d52ca43edaa1d9e53e6510fa78a48f69c2d
TRIVY_IMAGE=ghcr.io/aquasecurity/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
