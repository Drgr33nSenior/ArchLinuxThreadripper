# The shared model store on the NAS. Weights live on nas-nfs (retained on
# delete), one directory per repository revision, so model swaps add revisions
# beside the old ones and rollback needs no download.
#
# The ai-home-lab Namespace (restricted Pod Security) is owned by
# apps/base/namespace.yaml; apply it first. This file must not redefine it.
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: ai-models, namespace: ai-home-lab}
spec:
  accessModes: [ReadWriteMany]
  storageClassName: nas-nfs
  resources: {requests: {storage: 400Gi}}
---
# Model fetch Jobs (render-fetch.py, label app.kubernetes.io/name: model-fetch)
# download from Hugging Face. The namespace's default-deny allows only DNS, so
# give these pods public HTTPS and nothing else. Core NetworkPolicy cannot match
# an FQDN; fetch.py fixes the origin to https://huggingface.co (which redirects
# to its CDN) and checks every byte against the catalog. The NFS volume is
# mounted by the node, so the pod needs no NAS route.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: model-fetch-egress, namespace: ai-home-lab}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: model-fetch}
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 0.0.0.0/8
              - 10.0.0.0/8
              - 100.64.0.0/10
              - 127.0.0.0/8
              - 169.254.0.0/16
              - 172.16.0.0/12
              - 192.0.0.0/24
              - 192.0.2.0/24
              - 192.168.0.0/16
              - 198.18.0.0/15
              - 198.51.100.0/24
              - 203.0.113.0/24
              - 224.0.0.0/4
              - 240.0.0.0/4
      ports: [{protocol: TCP, port: 443}]
