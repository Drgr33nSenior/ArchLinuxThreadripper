# AI serving namespace and the shared model store on the NAS. Weights live on
# nas-nfs (retained on delete), one directory per repository revision, so
# model swaps add revisions beside the old ones and rollback needs no download.
apiVersion: v1
kind: Namespace
metadata:
  name: ai-home-lab
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.35
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: ai-models, namespace: ai-home-lab}
spec:
  accessModes: [ReadWriteMany]
  storageClassName: nas-nfs
  resources: {requests: {storage: 400Gi}}
