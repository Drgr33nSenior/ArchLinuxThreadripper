---
- name: Reload systemd units
  ansible.builtin.systemd_service:
    daemon_reload: true

# Restarting either daemon only re-reads its configuration; recorded RAS events
# stay in /var/lib/rasdaemon and SMART state is read again from the devices.
- name: Restart smartd
  ansible.builtin.systemd_service:
    name: smartd.service
    state: restarted

- name: Restart rasdaemon
  ansible.builtin.systemd_service:
    name: rasdaemon.service
    state: restarted
  when: lab_ras_enabled | bool
