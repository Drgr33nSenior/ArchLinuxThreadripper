# Managed by the host_maintenance Ansible role. Recording only: this build has
# no page-offlining or CPU-isolation code. Keep events in the local SQLite
# database (/var/lib/rasdaemon) and restart if the daemon fails.
[Service]
Restart=on-failure
RestartSec=30s
NoNewPrivileges=yes
ProtectHome=yes
PrivateTmp=yes
ProtectSystem=full
ReadWritePaths=/var/lib/rasdaemon
