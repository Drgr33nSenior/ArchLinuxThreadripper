---
- name: Configure an explicitly selected Arch bare-metal home lab
  hosts: ai_lab_baremetal
  become: true
  gather_facts: true
  serial: 1
  pre_tasks:
    - name: Require the supported host and one target
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == 'Archlinux'
          - ansible_facts.architecture == 'x86_64'
          - ansible_play_hosts_all | length == 1
        fail_msg: This profile is for one Arch lab host, never the existing EL9 VM.
  roles:
    - role: arch_host
    - role: k3s_baremetal
    - role: host_maintenance
      when: lab_host_maintenance_enabled | bool
