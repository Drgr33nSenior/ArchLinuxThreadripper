apiVersion: v1
kind: Namespace
metadata:
  name: workstation-observability
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: v1.35
---
# Host filesystem visibility needs a separate admission boundary. Applications
# retain restricted admission. The exporter itself is non-root and unprivileged.
apiVersion: v1
kind: Namespace
metadata:
  name: workstation-observability-host
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: v1.35
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ResourceQuota
metadata: {name: observability-budget, namespace: workstation-observability}
spec:
  hard:
    limits.memory: 4608Mi
    requests.storage: 70Gi
    pods: '12'
---
apiVersion: v1
kind: ResourceQuota
metadata: {name: host-collector-budget, namespace: workstation-observability-host}
spec:
  hard:
    limits.memory: 512Mi
    pods: '2'

