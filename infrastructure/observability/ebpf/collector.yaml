# Host-wide eBPF collector: Beyla RED metrics and Pyroscope CPU profiles.
# Privileged with host PID and network namespaces, by owner decision for this
# home lab. hostNetwork keeps it outside pod network policy; it reaches only
# the NAS receiver and the Kubernetes API.
apiVersion: v1
kind: ServiceAccount
metadata: {name: workstation-alloy-ebpf, namespace: workstation-observability-host}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: workstation-alloy-ebpf}
rules:
  # Beyla decorates metrics with pod, owner and service names.
  - apiGroups: ['']
    resources: [pods, services, nodes]
    verbs: [get, list, watch]
  - apiGroups: [apps]
    resources: [replicasets]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: workstation-alloy-ebpf}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: workstation-alloy-ebpf}
subjects:
  - {kind: ServiceAccount, name: workstation-alloy-ebpf, namespace: workstation-observability-host}
---
apiVersion: apps/v1
kind: DaemonSet
metadata: {name: alloy-ebpf, namespace: workstation-observability-host}
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: alloy-ebpf}
  template:
    metadata:
      labels: {app.kubernetes.io/name: alloy-ebpf}
    spec:
      serviceAccountName: workstation-alloy-ebpf
      automountServiceAccountToken: true
      hostPID: true
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      nodeSelector: {kubernetes.io/os: linux, kubernetes.io/arch: amd64}
      containers:
        - name: alloy
          image: docker.io/grafana/alloy:v1.19.2@sha256:b8ec653c44235fbe910879145dac3597d66b0aaecf60bcbbe82580767771a839
          # Loopback listener on a port distinct from the host Alloy (12345).
          args: ['run', '--server.http.listen-addr=127.0.0.1:12346', '--storage.path=/var/lib/alloy', '/etc/alloy/config.alloy']
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits: {cpu: '2', memory: 1Gi}
          securityContext:
            privileged: true
          volumeMounts:
            - {name: config, mountPath: /etc/alloy, readOnly: true}
            - {name: state, mountPath: /var/lib/alloy}
            - {name: sys-kernel, mountPath: /sys/kernel, readOnly: true}
      volumes:
        - name: config
          configMap: {name: alloy-ebpf-config}
        - {name: state, emptyDir: {sizeLimit: 2Gi}}
        - {name: sys-kernel, hostPath: {path: /sys/kernel, type: Directory}}
