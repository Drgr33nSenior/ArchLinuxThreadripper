apiVersion: v1
kind: ServiceAccount
metadata: {name: workstation-alloy-kubelet, namespace: workstation-observability}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: workstation-alloy-kubelet}
rules:
  - apiGroups: ['']
    resources: [nodes/metrics]
    # The renderer replaces this with TELEMETRY_NODE_NAME. No nodes/proxy.
    resourceNames: [review-required-node]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: workstation-alloy-kubelet}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: workstation-alloy-kubelet}
subjects:
  - {kind: ServiceAccount, name: workstation-alloy-kubelet, namespace: workstation-observability}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: alloy-to-kubelet, namespace: workstation-observability}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: alloy}
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock: {cidr: 192.0.2.2/32}
      ports: [{protocol: TCP, port: 10250}]
