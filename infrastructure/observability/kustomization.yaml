apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespaces.yaml
  - workloads.yaml
  - host-metrics.yaml
  - rbac.yaml
  - network-policy.yaml
configMapGenerator:
  - name: prometheus-config
    namespace: workstation-observability
    files: [prometheus.yml=config/prometheus.yaml, alerts.yml=config/alerts.yaml]
  - name: loki-config
    namespace: workstation-observability
    files: [config.yaml=config/loki.yaml]
  - name: tempo-config
    namespace: workstation-observability
    files: [config.yaml=config/tempo.yaml]
  - name: alloy-config
    namespace: workstation-observability
    files: [config.alloy=config/config.alloy]
  - name: grafana-datasources
    namespace: workstation-observability
    files: [datasources.yaml=config/datasources.yaml]
  - name: grafana-dashboards
    namespace: workstation-observability
    files: [dashboards.yaml=config/dashboards.yaml]
  - name: workstation-dashboard
    namespace: workstation-observability
    files: [workstation.json=dashboards/workstation.json]

