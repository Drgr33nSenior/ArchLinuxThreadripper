apiVersion: apps/v1
kind: DaemonSet
metadata: {name: node-exporter, namespace: workstation-observability-host}
spec:
  selector:
    matchLabels: {app.kubernetes.io/name: node-exporter}
  template:
    metadata:
      labels: {app.kubernetes.io/name: node-exporter}
    spec:
      automountServiceAccountToken: false
      nodeSelector: {kubernetes.io/os: linux, kubernetes.io/arch: amd64}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: node-exporter
          image: docker.io/prom/node-exporter:v1.12.1@sha256:1b4e4438faca4dd7e001dd445d161a4a2091b0fededa84093b3a8dfeae1f1be0
          # Do not accidentally report pod /proc or /sys as the workstation.
          # No hostNetwork: namespace-sensitive network collectors are disabled.
          args:
            - --path.procfs=/host/proc
            - --path.sysfs=/host/sys
            - --path.rootfs=/host/root
            - --collector.disable-defaults
            - --collector.cpu
            - --collector.cpufreq
            - --collector.meminfo
            - --collector.pressure
            - --collector.diskstats
            - --collector.filesystem
            - --collector.hwmon
            - --collector.mdadm
            - --collector.time
            - --collector.stat
            - --collector.uname
            - --collector.vmstat
            - --collector.textfile
            - --collector.textfile.directory=/host/root/var/lib/workstation-telemetry
            - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run/credentials|var/lib/kubelet/pods)($|/)
          ports: [{name: metrics, containerPort: 9100}]
          resources:
            requests: {cpu: 50m, memory: 192Mi}
            limits: {cpu: 250m, memory: 192Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /, port: metrics}
          volumeMounts:
            - {name: proc, mountPath: /host/proc, readOnly: true}
            - {name: sys, mountPath: /host/sys, readOnly: true}
            - {name: root, mountPath: /host/root, readOnly: true, mountPropagation: HostToContainer}
      volumes:
        - {name: proc, hostPath: {path: /proc, type: Directory}}
        - {name: sys, hostPath: {path: /sys, type: Directory}}
        - {name: root, hostPath: {path: /, type: Directory}}
---
apiVersion: v1
kind: Service
metadata: {name: node-exporter, namespace: workstation-observability-host}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: node-exporter}
  ports: [{name: metrics, port: 9100, targetPort: metrics}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: kube-state-metrics, namespace: workstation-observability}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: kube-state-metrics}
  template:
    metadata:
      labels: {app.kubernetes.io/name: kube-state-metrics}
    spec:
      serviceAccountName: kube-state-metrics
      automountServiceAccountToken: true
      nodeSelector: {kubernetes.io/os: linux, kubernetes.io/arch: amd64}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: kube-state-metrics
          image: registry.k8s.io/kube-state-metrics/kube-state-metrics:v2.20.0@sha256:42cfe3723a5f058171c627537fb57a3ea0f26e4380fa18555a95cb1a1b4cfc5b
          args:
            - --resources=pods,nodes,deployments,persistentvolumeclaims
            - --namespaces=ai-home-lab,workstation-observability,workstation-observability-host,kube-amd-gpu,kube-system
            - --metric-allowlist=kube_pod_container_resource_requests,kube_pod_container_resource_limits,kube_pod_container_status_restarts_total,kube_pod_container_status_last_terminated_reason,kube_pod_status_phase,kube_pod_status_ready,kube_node_status_allocatable,kube_node_status_capacity,kube_node_status_condition,kube_deployment_status_replicas_available,kube_persistentvolumeclaim_status_phase,kube_persistentvolumeclaim_resource_requests_storage_bytes
          ports: [{name: metrics, containerPort: 8080}, {name: health, containerPort: 8081}]
          resources:
            requests: {cpu: 50m, memory: 192Mi}
            limits: {cpu: 250m, memory: 192Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          readinessProbe:
            httpGet: {path: /readyz, port: health}
---
apiVersion: v1
kind: Service
metadata: {name: kube-state-metrics, namespace: workstation-observability}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: kube-state-metrics}
  ports: [{name: metrics, port: 8080, targetPort: metrics}]
