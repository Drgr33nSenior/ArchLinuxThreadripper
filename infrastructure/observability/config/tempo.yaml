# Tempo 3 uses single-binary/backend-worker, not the obsolete ingester/compactor
# configuration from Tempo 2. No Kafka or metrics-generator is required here.
target: all
server:
  http_listen_port: 3200
  log_level: warn
distributor:
  receivers:
    otlp:
      protocols:
        grpc: {endpoint: '0.0.0.0:4317'}
storage:
  trace:
    backend: local
    wal: {path: /var/tempo/wal}
    local: {path: /var/tempo/blocks}
    pool:
      max_workers: 4
      queue_depth: 100
query_frontend:
  max_outstanding_per_tenant: 100
  response_consumers: 2
  search:
    concurrent_jobs: 4
    max_duration: 24h
  trace_by_id:
    query_shards: 4
    concurrent_shards: 2
overrides:
  defaults:
    ingestion:
      rate_limit_bytes: 1048576
      burst_size_bytes: 2097152
    global:
      max_bytes_per_trace: 1048576
    compaction:
      block_retention: 72h
    read:
      max_search_duration: 24h
usage_report: {reporting_enabled: false}
