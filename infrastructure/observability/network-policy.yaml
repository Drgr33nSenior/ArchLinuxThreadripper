# Documentation-range addresses deliberately block deployment until the renderer
# replaces them with reviewed apiserver and workstation identities.
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: loki-from-workstation, namespace: workstation-observability}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: loki}
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock: {cidr: 192.0.2.2/32}
      ports: [{protocol: TCP, port: 3100}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: alloy-to-sglang, namespace: workstation-observability}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: alloy}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ai-home-lab}
          podSelector:
            matchLabels: {app.kubernetes.io/name: sglang}
      ports: [{protocol: TCP, port: 30000}]
---
apiVersion: networking.k8s.io/v1
