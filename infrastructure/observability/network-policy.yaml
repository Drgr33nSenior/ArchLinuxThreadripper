  policyTypes: [Ingress]
  ingress:
    - from:
        # Replaced from TELEMETRY_WORKSTATION_ADDRESS. Service stays ClusterIP.
        - ipBlock: {cidr: 192.0.2.2/32}
      ports: [{protocol: TCP, port: 4317}, {protocol: TCP, port: 4318}]
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ai-home-lab}
          podSelector:
            matchLabels: {app.kubernetes.io/name: sglang}
      ports: [{protocol: TCP, port: 4317}]
