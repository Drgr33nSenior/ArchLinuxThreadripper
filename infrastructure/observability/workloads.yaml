---
apiVersion: apps/v1
kind: Deployment
metadata: {name: prometheus, namespace: workstation-observability}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: prometheus}
  template:
    metadata:
      labels: {app.kubernetes.io/name: prometheus}
    spec:
      automountServiceAccountToken: false
      nodeSelector: {kubernetes.io/os: linux, kubernetes.io/arch: amd64}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: prometheus
          image: docker.io/prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
          args:
            - '--config.file=/etc/prometheus/prometheus.yml'
            - '--storage.tsdb.path=/prometheus'
            - '--storage.tsdb.retention.time=14d'
            - '--storage.tsdb.retention.size=24GB'
            - '--web.enable-remote-write-receiver'
            - '--query.max-concurrency=4'
            - '--query.timeout=30s'
          ports:
            - {name: http, containerPort: 9090}
          resources:
            requests: {cpu: '500m', memory: '1536Mi'}
            limits: {cpu: '2', memory: '1536Mi'}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          env:
            - {name: GOMEMLIMIT, value: '1228MiB'}
          readinessProbe:
            httpGet: {path: '/-/ready', port: http}
            initialDelaySeconds: 10
            timeoutSeconds: 3
          startupProbe:
            httpGet: {path: '/-/ready', port: http}
            failureThreshold: 60
            periodSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /prometheus}
            - {name: tmp, mountPath: /tmp}
            - {name: prometheus-config, mountPath: /etc/prometheus, readOnly: true}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: prometheus-data}
        - name: tmp
          emptyDir: {sizeLimit: 128Mi}
        - name: prometheus-config
          configMap: {name: prometheus-config}
---
apiVersion: v1
kind: Service
metadata: {name: prometheus, namespace: workstation-observability}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: prometheus}
  ports:
    - {name: http, port: 9090, targetPort: http}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: prometheus-data, namespace: workstation-observability}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests: {storage: 30Gi}
