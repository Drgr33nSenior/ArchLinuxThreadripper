---
apiVersion: apps/v1
kind: Deployment
metadata: {name: grafana, namespace: workstation-observability}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: grafana}
  template:
    metadata:
      labels: {app.kubernetes.io/name: grafana}
    spec:
      automountServiceAccountToken: false
      nodeSelector: {kubernetes.io/os: linux, kubernetes.io/arch: amd64}
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: grafana
          image: docker.io/grafana/grafana:13.2.1@sha256:f772d434e8fab0049deb2b1b30abd43342bcfca1537614aa8d36080232cf4283
          ports:
            - {name: http, containerPort: 3000}
          resources:
            requests: {cpu: '250m', memory: '512Mi'}
            limits: {cpu: '2', memory: '512Mi'}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          env:
            - {name: GOMEMLIMIT, value: '409MiB'}
            - {name: GF_SECURITY_ADMIN_USER, valueFrom: {secretKeyRef: {name: grafana-admin, key: admin-user}}}
            - {name: GF_SECURITY_ADMIN_PASSWORD, valueFrom: {secretKeyRef: {name: grafana-admin, key: admin-password}}}
            - {name: GF_AUTH_ANONYMOUS_ENABLED, value: 'false'}
            - {name: GF_USERS_ALLOW_SIGN_UP, value: 'false'}
            - {name: GF_ANALYTICS_REPORTING_ENABLED, value: 'false'}
            - {name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: 'false'}
            - {name: GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES, value: 'false'}
            - {name: GF_LOG_LEVEL, value: warn}
            - {name: GF_PLUGINS_PREINSTALL_DISABLED, value: 'true'}
          readinessProbe:
            httpGet: {path: '/api/health', port: http}
            initialDelaySeconds: 10
            timeoutSeconds: 3
          startupProbe:
            httpGet: {path: '/api/health', port: http}
            failureThreshold: 60
            periodSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /var/lib/grafana}
            - {name: tmp, mountPath: /tmp}
            - {name: grafana-datasources, mountPath: /etc/grafana/provisioning/datasources, readOnly: true}
            - {name: grafana-dashboards, mountPath: /etc/grafana/provisioning/dashboards, readOnly: true}
            - {name: workstation-dashboard, mountPath: /var/lib/grafana/dashboards, readOnly: true}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: grafana-data}
        - name: tmp
          emptyDir: {sizeLimit: 128Mi}
        - name: grafana-datasources
          configMap: {name: grafana-datasources}
        - name: grafana-dashboards
          configMap: {name: grafana-dashboards}
        - name: workstation-dashboard
          configMap: {name: workstation-dashboard}
---
apiVersion: v1
kind: Service
metadata: {name: grafana, namespace: workstation-observability}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: grafana}
  ports:
    - {name: http, port: 3000, targetPort: http}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: grafana-data, namespace: workstation-observability}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests: {storage: 2Gi}
---
