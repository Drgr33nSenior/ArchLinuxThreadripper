# Install through the existing K3s HelmChartConfig mechanism after site review.
# Apply only the copy written by `workstationctl service render`: it adds the
# site's node_address as the Service's single externalIP. ServiceLB remains
# disabled and no NodePort is allocated.
#
# HTTPS is reached on TCP 443 of that one node address only. kube-proxy DNATs
# exactly <node_address>:443 to the Traefik Pod; nothing listens on 0.0.0.0, so
# other host addresses and interfaces (for example a future DMZ NIC) are not
# bound. externalTrafficPolicy Local keeps the client source address for the
# private-clients allowlist. The host guard additionally limits 443 to the
# management VLAN interface and approved client CIDRs.
#
# The chart's ports.websecure.hostIP is deliberately not used: chart 40.x also
# writes it into the entryPoint listen address, which a non-hostNetwork Pod
# cannot bind. Port 80 is not exposed (no plaintext listener, not even a redirect).
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    service:
      spec:
        type: ClusterIP
        externalTrafficPolicy: Local
    ports:
      web:
        expose:
          default: false
      websecure:
        exposedPort: 443
        transport:
          respondingTimeouts:
            # Reading the whole request, body included: a large document upload on a slow
            # client link needs minutes, not 30 s.
            readTimeout: 300s
            # writeTimeout is an absolute limit on writing a response, not an idle one: a
            # streamed reply is one long write and pings do not extend it. Keep it above the
            # gateway's overall cap (3600 s) so the gateway's budgets decide, not Traefik.
            writeTimeout: 3660s
            # Idle keep-alive connections between requests (not silence within a reply).
            idleTimeout: 240s
    logs:
      access:
        enabled: false
    ingressRoute:
      dashboard:
        enabled: false
    additionalArguments:
      - --entryPoints.websecure.forwardedHeaders.insecure=false
