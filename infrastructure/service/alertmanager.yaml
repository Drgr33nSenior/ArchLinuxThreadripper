apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
  namespace: workstation-observability
  annotations: {workstation.ai/qualification: pending-notification-test}
spec:
  replicas: 0
  strategy: {type: Recreate}
  selector: {matchLabels: {app.kubernetes.io/name: alertmanager}}
  template:
    metadata: {labels: {app.kubernetes.io/name: alertmanager}}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: alertmanager
          image: docker.io/prom/alertmanager:v0.34.1@sha256:84967b9b7ba45e38a9278d3e594305f43d4993c310df3905b51138b816c365f3
          args: [--config.file=/config/alertmanager.yaml, --storage.path=/state, '--cluster.listen-address=', --log.level=error, --data.retention=120h]
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 250m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          ports: [{name: http, containerPort: 9093}]
          readinessProbe: {httpGet: {path: /-/ready, port: http}}
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
            - {name: receiver, mountPath: /run/receiver, readOnly: true}
            - {name: state, mountPath: /state}
      volumes:
        - {name: config, configMap: {name: service-alertmanager}}
        - {name: receiver, secret: {secretName: service-alert-receiver}}
        - {name: state, persistentVolumeClaim: {claimName: service-alertmanager}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: service-alertmanager, namespace: workstation-observability}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: workstation-retain
  resources: {requests: {storage: 1Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: alertmanager, namespace: workstation-observability}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: alertmanager}
  ports: [{port: 9093, targetPort: http}]
---
apiVersion: v1
kind: ConfigMap
metadata: {name: service-alertmanager, namespace: workstation-observability}
data:
  alertmanager.yaml: |
    global:
      resolve_timeout: 5m
    route:
      receiver: owner
      group_by: [alertname, cluster]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: silent-maintenance
          matchers: ['alertname="WorkstationServiceMaintenance"']
    receivers:
      - name: silent-maintenance
      - name: owner
        webhook_configs:
          - url_file: /run/receiver/url
            send_resolved: true
            max_alerts: 20
            timeout: 10s
    inhibit_rules:
      - source_matchers: ['alertname="WorkstationServiceMaintenance"']
        target_matchers: ['alertname=~"WorkstationModelUnavailable|WorkstationModelErrors"']
        equal: [cluster]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: service-alertmanager, namespace: workstation-observability}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: alertmanager}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app.kubernetes.io/name: prometheus}}
      ports: [{protocol: TCP, port: 9093}]
  # Owner adds only the chosen notification receiver IP/port. No general
  # Internet egress. DNS is allowed by the existing namespace policy.
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: prometheus-to-service-alertmanager, namespace: workstation-observability}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: prometheus}}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: {matchLabels: {app.kubernetes.io/name: alertmanager}}
      ports: [{protocol: TCP, port: 9093}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: prometheus-to-service-gateway, namespace: workstation-observability}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: prometheus}}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: ai-home-lab}}
          podSelector: {matchLabels: {app.kubernetes.io/name: litellm}}
      ports: [{protocol: TCP, port: 4000}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: gateway-from-service-prometheus, namespace: ai-home-lab}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: litellm}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: workstation-observability}}
          podSelector: {matchLabels: {app.kubernetes.io/name: prometheus}}
      ports: [{protocol: TCP, port: 4000}]
