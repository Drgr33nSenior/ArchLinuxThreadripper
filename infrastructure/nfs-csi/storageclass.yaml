# NAS-backed ReadWriteMany volumes. Not the default class: local-path stays the
# default for databases, indexes and other latency-sensitive state.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nas-nfs
provisioner: nfs.csi.k8s.io
parameters:
  server: 192.168.30.10
  share: /srv/microserver/k8s
  subDir: ${pvc.metadata.namespace}/${pvc.metadata.name}
  # Keep the directory on the NAS when a claim or volume is deleted.
  onDelete: retain
reclaimPolicy: Retain
volumeBindingMode: Immediate
allowVolumeExpansion: true
mountOptions:
  - nfsvers=4.2
  - hard
  - proto=tcp
