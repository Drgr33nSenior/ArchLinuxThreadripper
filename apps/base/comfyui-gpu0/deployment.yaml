apiVersion: apps/v1
kind: Deployment
metadata:
  name: comfyui-gpu0
  annotations:
    ai-home-lab.local/qualification: pending-shared-mode-second-image-generator
spec:
  # Shared mode only: the second image generator, in the headroom SGLang TP2 leaves
  # on gpu-0 to match gpu-1 (SGLang sizes every rank's KV pool from the tightest card).
  replicas: 0
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: comfyui-gpu0}
  template:
    metadata:
      labels: {app.kubernetes.io/name: comfyui-gpu0}
    spec:
      automountServiceAccountToken: false
      priorityClassName: creative-priority
      terminationGracePeriodSeconds: 60
      nodeSelector: {ai-home-lab.local/gfx: gfx1201}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        # render and video on gr33nstein, as the SGLang serving contract.
        supplementalGroups: [987, 983]
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        # ComfyUI refuses to start when a directory given by --user/--input/--output-directory
        # is missing (2026-11-11), and /work is a fresh emptyDir: create them with the MIOpen dirs.
        - name: miopen-dirs
          image: docker.io/library/busybox:1.37.0@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
          command: [sh, -ec]
          args: [mkdir -p /state/Data/miopen-gpu0/user-db /state/Data/miopen-gpu0/cache /work/user /work/input /work/output]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: '1', memory: 64Mi}
            limits: {cpu: '1', memory: 64Mi}
          volumeMounts:
            - {name: state, mountPath: /state}
            - {name: work, mountPath: /work}
      # The shared gpu-0 claim (infrastructure/gpu-operator/claims.yaml) that SGLang TP2
      # also references; DRA shows this pod only that card, as ordinal zero.
      resourceClaims:
        - {name: gpu-0, resourceClaimName: gpu-0}
      containers:
        - name: comfyui
          # The same signed creative image as SwarmUI: its embedded ComfyUI venv, run
          # directly instead of self-started by SwarmUI.
          image: registry.lan.thespry.family/local/creative-gfx1201@sha256:47a22cd2d6a0e95686d7f4f899944bc2b2bd7258a704b4ae16259af87bd324c2
          command: [/SwarmUI/dlbackend/ComfyUI/venv/bin/python, /SwarmUI/dlbackend/ComfyUI/main.py]
          # Measured SDXL settings (PR #90) and the shared-card reserve (PR #96), as SwarmUI's
          # own backend in Backends.fds.
          args:
            - --listen
            - 0.0.0.0
            - --port
            - '7821'
            - --extra-model-paths-config
            - /config/comfy-model-paths.yaml
            - --output-directory
            - /work/output
            - --temp-directory
            - /tmp/comfy-temp
            - --input-directory
            - /work/input
            - --user-directory
            - /work/user
            - --fp8_e4m3fn-unet
            - --fp8_e4m3fn-text-enc
            - --reserve-vram
            - '1.5'
            # Wan 2.2 video (service-tools generate_video): stream the 14B experts from the local
            # NVMe each step instead of holding them in RAM (measured 2026-11-12: a 5 s 832x480
            # clip reads ~35-45 GB at up to 22 GB/s; sampling stays compute-bound).
            - --fast-disk
            # Comfy Kitchen's attention: a 5 s Wan clip 92 -> 71-76 s on gfx1201 (2026-11-12). It is
            # not bit-identical to SDPA (same-seed PSNR 14-17 dB video, 25.8 dB SDXL) but side by
            # side the clips, faces and SDXL portraits were of the same quality; SDXL time unchanged.
            - --use-ck-attention
          ports: [{name: http, containerPort: 7821}]
          env:
            - {name: HF_HUB_OFFLINE, value: '1'}
            - {name: HOME, value: /work}
            - {name: COMFYUI_ENABLE_MIOPEN, value: '1'}
            - {name: MIOPEN_USER_DB_PATH, value: /miopen/user-db}
            - {name: MIOPEN_CUSTOM_CACHE_DIR, value: /miopen/cache}
            # ROCm: keep AMD's profiler SDK from registering as an HSA tool. Registered, it
            # uses up the process's KFD events and ROCr then spins a core per waiting thread
            # while idle (measured 2026-11-11; see the serving profile's env note).
            - {name: ROCPROFILER_REGISTER_ENABLED, value: '0'}
            # Leave chat CUs this process cannot occupy: SGLang's TP2 ranks run in lockstep, so a
            # video saturating this card slowed every chat token. Measured 2026-11-12 (5 s clip, chat
            # decode at idle 86 tok/s): no mask 21-24 tok/s, CUs 0-47 of 64 34-35 tok/s with the
            # clip 76 -> 82 s; 0-31 was worse on both (15 tok/s, 104 s). SDXL time unchanged.
            - {name: HSA_CU_MASK, value: '0:0-47'}
          resources:
            # SDXL fp8 1024^2 measured 2026-11-11: anon peak 8.8 GiB, 12.4 GiB with page cache
            # (sdxl-vram-tiled-miopen-fp8u-fp8te, host cgroup sampler). Guaranteed QoS.
            # Live shared mode 2026-11-11: peak 8.8 GiB (anon 7.7) of 10.
            # Wan video with --fast-disk 2026-11-12 (test pod, SDXL then Wan in one process): anon
            # peak 7.3 GiB; the streamed experts are page cache, which the limit reclaims.
            # CPU measured live 2026-11-11 in shared mode (chat + both image generators,
            # cold and warm SDXL 1024^2, simultaneous pairs, 1 s cgroup samples): peak 2.3 cores,
            # p95 1.6 per image pod. 4 whole cores keeps Guaranteed QoS with headroom.
            requests: {cpu: '4', memory: 10Gi}
            limits: {cpu: '4', memory: 10Gi}
            claims: [{name: gpu-0}]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          startupProbe:
            httpGet: {path: /system_stats, port: http}
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet: {path: /system_stats, port: http}
            timeoutSeconds: 3
          volumeMounts:
            - {name: config, mountPath: /config, readOnly: true}
            - {name: work, mountPath: /work}
            - {name: state, mountPath: /miopen, subPath: Data/miopen-gpu0}
            # SDXL at the catalogue revision, read-only, at SwarmUI's model path.
            # The Wan 2.2 T2V A14B stack (catalog wan2.2-t2v-a14b), staged on the local-NVMe
            # creative-models volume by infrastructure/ai-stack/models/stage-video.py.
            - {name: state, mountPath: /video, subPath: Video, readOnly: true}
            - name: models
              mountPath: /SwarmUI/Models/Stable-Diffusion/OfficialStableDiffusion
              subPath: stabilityai/stable-diffusion-xl-base-1.0/462165984030d82259a11f4367a4eed129e94a7b
              readOnly: true
      volumes:
        - name: config
          configMap: {name: comfyui-gpu0-model-paths}
        - name: work
          emptyDir: {sizeLimit: 8Gi}
        - name: state
          persistentVolumeClaim: {claimName: creative-models}
        - name: models
          persistentVolumeClaim: {claimName: ai-models, readOnly: true}
