apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  annotations:
    ai-home-lab.local/qualification: pending-image-and-admin-bootstrap
spec:
  replicas: 0
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: open-webui}
  template:
    metadata:
      labels: {app.kubernetes.io/name: open-webui}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: open-webui
          image: registry.invalid/ai-home-lab/open-webui:UNQUALIFIED
          ports: [{name: http, containerPort: 8080}]
          env:
            - {name: OPENAI_API_BASE_URL, value: 'http://sglang:30000/v1'}
            - {name: OPENAI_API_KEY, value: ''}
            - {name: WEBUI_AUTH, value: 'true'}
            - {name: ENABLE_SIGNUP, value: 'false'}
            - {name: ENABLE_OLLAMA_API, value: 'false'}
            - {name: OFFLINE_MODE, value: 'true'}
            - {name: HF_HUB_OFFLINE, value: '1'}
            - name: WEBUI_SECRET_KEY
              valueFrom:
                secretKeyRef: {name: webui-session-secret, key: secret-key}
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {cpu: '4', memory: 2Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          startupProbe:
            httpGet: {path: /health, port: http}
            failureThreshold: 60
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /health, port: http}
            timeoutSeconds: 3
          # Open WebUI 0.13.3's /health is an async handler that returns a constant: no
          # database (that is /health/db), model or gateway call, so only a hung event loop
          # fails it. Measured 2026-11-12: about 1 ms, worst 7 ms. Restart only after
          # 3 minutes without any answer, well beyond a long document ingest.
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 6
          volumeMounts: [{name: data, mountPath: /app/backend/data}]
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: webui-data}
