apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cluster-dns
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: webui-to-sglang
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: open-webui}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: sglang}
      ports: [{protocol: TCP, port: 30000}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: sglang-from-webui
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: sglang}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: open-webui}
      ports: [{protocol: TCP, port: 30000}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: webui-from-ingress
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: open-webui}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {app.kubernetes.io/name: traefik}
      ports: [{protocol: TCP, port: 8080}]
