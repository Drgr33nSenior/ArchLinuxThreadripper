# Each exact application flow supplements the base default-deny and DNS policy.
{
  "apiVersion": "networking.k8s.io/v1",
  "kind": "NetworkPolicy",
  "metadata": {
    "name": "open-webui-service-flows"
  },
  "spec": {
    "podSelector": {
      "matchLabels": {
        "app.kubernetes.io/name": "open-webui"
      }
    },
    "policyTypes": [
      "Ingress",
      "Egress"
    ],
    "ingress": [
      {
        "from": [
          {
            "podSelector": {
              "matchLabels": {
                "app.kubernetes.io/name": "service-tools"
              }
            }
          }
        ],
        "ports": [
          {
            "protocol": "TCP",
            "port": 8080
          }
        ]
      }
    ],
    "egress": [
      {
        "to": [
          {
            "podSelector": {
              "matchLabels": {
                "app.kubernetes.io/name": "litellm"
              }
            }
          }
        ],
        "ports": [
          {
            "protocol": "TCP",
            "port": 4000
          }
        ]
      },
      {
        "to": [
          {
            "podSelector": {
              "matchLabels": {
                "app.kubernetes.io/name": "service-tools"
              }
            }
          }
        ],
        "ports": [
          {
            "protocol": "TCP",
            "port": 8000
          }
        ]
      }
    ]
  }
}
