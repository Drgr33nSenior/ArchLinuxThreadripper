apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [workloads.yaml, storage.yaml, network-policy.yaml]
configMapGenerator:
  - name: gateway-runtime
    files: [boundary.py, gateway_entry.py, service_tools.py, assistant_metrics.py, handoff.py, project_scope.py, retrieval.py, web_search.py, web-search-policy.json, migrate.py, health.py, sdxl-workflow.json, image-profile.json, video.py, video-profile.json, wan-t2v-workflow.json]
  - name: gateway-config
    files: [litellm.yaml]
  - name: gateway-postgres-init
    files: [init-db.sh]
