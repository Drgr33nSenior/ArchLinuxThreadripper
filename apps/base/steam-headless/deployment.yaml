apiVersion: apps/v1
kind: Deployment
metadata:
  name: steam-headless
  annotations:
    ai-home-lab.local/qualification: pending-built-image-display-input-and-security
spec:
  replicas: 0
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: steam-headless, ai-home-lab.local/profile: shared}
  template:
    metadata:
      labels: {app.kubernetes.io/name: steam-headless, ai-home-lab.local/profile: shared}
    spec:
      automountServiceAccountToken: false
      # Its own user namespace: container root is an unprivileged host UID range, which is
      # what makes the unmasked /proc below safe (namespace gaming, baseline).
      hostUsers: false
      priorityClassName: family-gaming-priority
      terminationGracePeriodSeconds: 120
      nodeSelector: {ai-home-lab.local/gfx: gfx1201, kubernetes.io/arch: amd64, kubernetes.io/os: linux}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      # DRA: standalone claims applied with the GPU Operator
      # (infrastructure/gpu-operator/claims.yaml); see docs/HOME-LAB.md.
      resourceClaims:
        - {name: gpu-1, resourceClaimName: gpu-1}
      containers:
        - name: steam-headless
          # Published by the AI-stack `gaming` stage (scanned, signed, verified). A digest
          # is not qualification: the annotation above stays pending until on-GPU checks.
          image: registry.lan.thespry.family/local/steam-headless@sha256:e9cbd13d361988fc3d1db12ea1d062d1fcdf688c183646536ea1432798ec2ea0
          envFrom:
            - configMapRef: {name: sunshine-profile}
          env:
            - {name: ENABLE_STEAM, value: 'true'}
            - {name: ENABLE_SUNSHINE, value: 'true'}
            - {name: STEAM_ARGS, value: '-silent'}
            # Maintained Steam-Headless contract; all game/shader/pairing data is
            # under this existing per-family-member persistent home volume.
            - {name: USER, value: default}
            - {name: USER_HOME, value: /home/default}
            - {name: XDG_CACHE_HOME, value: /home/default/.cache}
            - {name: MESA_SHADER_CACHE_MAX_SIZE, value: 2G}
            - name: SUNSHINE_USER
              valueFrom:
                secretKeyRef: {name: gaming-credentials, key: username}
            - name: SUNSHINE_PASS
              valueFrom:
                secretKeyRef: {name: gaming-credentials, key: sunshine-password}
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            # Steam's bubblewrap mounts a fresh /proc for its sandbox; masked paths forbid that.
            procMount: Unmasked
            capabilities:
              drop: [ALL]
            # RuntimeDefault plus unprivileged user/mount namespace creation, which
            # Steam's bubblewrap sandbox requires (infrastructure/gaming/seccomp;
            # installed on the node by the k3s_baremetal role). Still no capabilities.
            seccompProfile: {type: Localhost, localhostProfile: profiles/workstation-gaming-userns.json}
          resources:
            requests: {cpu: '12', memory: 12Gi}
            limits: {cpu: '12', memory: 12Gi}
            claims: [{name: gpu-1}]
          ports:
            - {name: http, containerPort: 47989, protocol: TCP}
            - {name: https, containerPort: 47984, protocol: TCP}
            - {name: rtsp, containerPort: 48010, protocol: TCP}
            - {name: video, containerPort: 47998, protocol: UDP}
            - {name: control, containerPort: 47999, protocol: UDP}
            - {name: audio, containerPort: 48000, protocol: UDP}
          volumeMounts:
            - {name: user, mountPath: /home/default}
            - {name: shm, mountPath: /dev/shm}
      volumes:
        - name: user
          persistentVolumeClaim: {claimName: gaming-home}
        - name: shm
          emptyDir: {medium: Memory, sizeLimit: 2Gi}
