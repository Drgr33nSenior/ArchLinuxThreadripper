apiVersion: apps/v1
kind: Deployment
metadata:
  name: swarmui
  annotations:
    ai-home-lab.local/qualification: pending-packaged-swarmui-rocm-comfyui
spec:
  replicas: 0
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: swarmui}
  template:
    metadata:
      labels: {app.kubernetes.io/name: swarmui}
    spec:
      automountServiceAccountToken: false
      priorityClassName: creative-priority
      terminationGracePeriodSeconds: 120
      nodeSelector: {ai-home-lab.local/gfx: gfx1201}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        # render and video on gr33nstein, as the SGLang serving contract.
        supplementalGroups: [987, 983]
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: seed-backend
          image: docker.io/library/busybox:1.37.0@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
          command: [sh, -ec]
          args:
            - mkdir -p /state/Data/miopen/user-db /state/Data/miopen/cache /state/Models/diffusion_models/QwenImage /state/Output; if [ ! -e /state/Data/Backends.fds ]; then cp /seed/Backends.fds /state/Data/Backends.fds; fi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: '2', memory: 64Mi}
            limits: {cpu: '2', memory: 64Mi}
          volumeMounts:
            - {name: state, mountPath: /state}
            - {name: backend, mountPath: /seed, readOnly: true}
      # DRA: standalone claims applied with the GPU Operator
      # (infrastructure/gpu-operator/claims.yaml); see docs/HOME-LAB.md.
      resourceClaims:
        - {name: gpu-1, resourceClaimName: gpu-1}
      containers:
        - name: swarmui
          # Signed creative image from the AI-stack pipeline (infrastructure/ai-stack,
          # stages comfyui/swarmui/creative): prebuilt SwarmUI + embedded ComfyUI/ROCm
          # venv, no installation or downloads on boot.
          image: registry.lan.thespry.family/local/creative-gfx1201@sha256:47a22cd2d6a0e95686d7f4f899944bc2b2bd7258a704b4ae16259af87bd324c2
          ports: [{name: http, containerPort: 7801}]
          env:
            - {name: HF_HUB_OFFLINE, value: '1'}
            # MIOpen convolutions: tiled SDXL 1024 warm 4.8-5.2 s vs 6.2-6.4 s without
            # (gpu-1, 2026-11-11). Each new image size is tuned once; the find/kernel
            # databases persist in Data so restarts do not repeat it.
            - {name: COMFYUI_ENABLE_MIOPEN, value: '1'}
            - {name: MIOPEN_USER_DB_PATH, value: /SwarmUI/Data/miopen/user-db}
            - {name: MIOPEN_CUSTOM_CACHE_DIR, value: /SwarmUI/Data/miopen/cache}
            # ROCm: keep AMD's profiler SDK from registering as an HSA tool. Registered, it
            # uses up the process's KFD events and ROCr then spins a core per waiting thread
            # while idle (measured 2026-11-11; see the serving profile's env note).
            - {name: ROCPROFILER_REGISTER_ENABLED, value: '0'}
            # Leave SGLang's tensor-parallel rank on this card 16 of 64 CUs ComfyUI cannot occupy, as
            # comfyui-gpu0 does (14 Nov bake-off: 48 against 64 CUs cost about 5% picture time).
            - {name: HSA_CU_MASK, value: '0:0-47'}
          resources:
            # CPU measured live 2026-11-11 in shared mode (chat + both image generators,
            # cold and warm SDXL 1024^2, simultaneous pairs, 1 s cgroup samples): peak 2.3 cores,
            # p95 1.6 per image pod. 4 whole cores keeps Guaranteed QoS with headroom.
            # Memory: peak 9.9 GiB (anon 9.0) of 12.
            # Qwen-Image-2512 bf16 1328^2 2026-11-14 (test pod with these limits and flags): anon peak
            # 7.0 GiB; 88 s cold and 72-74 s warm with gpu-0 rendering at the same time (50 s in an
            # 8-core test pod alone); 2.2 GB of the card free at peak.
            requests: {cpu: '4', memory: 12Gi}
            limits: {cpu: '4', memory: 12Gi}
            claims: [{name: gpu-1}]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          startupProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 10
            failureThreshold: 120
          readinessProbe:
            httpGet: {path: /, port: http}
            timeoutSeconds: 3
          volumeMounts:
            - {name: state, mountPath: /SwarmUI/Data, subPath: Data}
            - {name: state, mountPath: /SwarmUI/Models, subPath: Models}
            - {name: state, mountPath: /SwarmUI/Output, subPath: Output}
            # The Qwen-Image-2512 picture stack (catalog qwen-image-2512), staged on the local-NVMe
            # creative-models volume by infrastructure/ai-stack/models/stage-video.py, and the model
            # path file that points the self-started ComfyUI at it (Backends.fds ExtraArgs).
            - {name: state, mountPath: /image, subPath: Image, readOnly: true}
            - {name: image-paths, mountPath: /config, readOnly: true}
            # The same model again as Swarm model QwenImage/qwen_image_2512_bf16: SwarmUI only accepts
            # a request for a model in its own folders. Read-only one level down, so Swarm's metadata
            # cache in Models/diffusion_models stays writable.
            - name: state
              mountPath: /SwarmUI/Models/diffusion_models/QwenImage
              subPath: Image/diffusion_models
              readOnly: true
      volumes:
        - name: state
          persistentVolumeClaim: {claimName: creative-models}
        - name: backend
          configMap: {name: swarmui-backend}
        - name: image-paths
          configMap: {name: swarmui-image-paths}
