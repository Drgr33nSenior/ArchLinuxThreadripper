apiVersion: apps/v1
kind: Deployment
metadata:
  name: swarmui
  annotations:
    ai-home-lab.local/qualification: pending-packaged-swarmui-rocm-comfyui
spec:
  replicas: 0
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: swarmui}
  template:
    metadata:
      labels: {app.kubernetes.io/name: swarmui}
    spec:
      automountServiceAccountToken: false
      priorityClassName: creative-priority
      terminationGracePeriodSeconds: 120
      nodeSelector: {ai-home-lab.local/gfx: gfx1201}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        - name: seed-backend
          image: docker.io/library/busybox:1.37.0@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
          command: [sh, -ec]
          args:
            - mkdir -p /state/Data /state/Models /state/Output; if [ ! -e /state/Data/Backends.fds ]; then cp /seed/Backends.fds /state/Data/Backends.fds; fi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: '2', memory: 64Mi}
            limits: {cpu: '2', memory: 64Mi}
          volumeMounts:
            - {name: state, mountPath: /state}
            - {name: backend, mountPath: /seed, readOnly: true}
      containers:
        - name: swarmui
          image: registry.invalid/ai-home-lab/swarmui-rocm:UNQUALIFIED
          # Image contract: prebuilt SwarmUI + embedded ComfyUI/ROCm venv,
          # standard SwarmUI entrypoint, no installation or downloads on boot.
          ports: [{name: http, containerPort: 7801}]
          env:
            - {name: HF_HUB_OFFLINE, value: '1'}
          resources:
            requests: {cpu: '12', memory: 12Gi, amd.com/gpu: '1'}
            limits: {cpu: '12', memory: 12Gi, amd.com/gpu: '1'}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          startupProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 10
            failureThreshold: 120
          readinessProbe:
            httpGet: {path: /, port: http}
            timeoutSeconds: 3
          volumeMounts:
            - {name: state, mountPath: /SwarmUI/Data, subPath: Data}
            - {name: state, mountPath: /SwarmUI/Models, subPath: Models}
            - {name: state, mountPath: /SwarmUI/Output, subPath: Output}
      volumes:
        - name: state
          persistentVolumeClaim: {claimName: creative-models}
        - name: backend
          configMap: {name: swarmui-backend}
