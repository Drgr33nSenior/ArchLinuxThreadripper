# Exact memory flows; each supplements the base default-deny and DNS policy.
# service-tools -> graphiti-memory -> {neo4j, memory-embedding, litellm}.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: graphiti-memory-flows}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: graphiti-memory}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{podSelector: {matchLabels: {app.kubernetes.io/name: service-tools}}}]
      ports: [{protocol: TCP, port: 8000}]
  egress:
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/name: neo4j}}}]
      ports: [{protocol: TCP, port: 7687}]
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/name: memory-embedding}}}]
      ports: [{protocol: TCP, port: 8080}]
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/name: litellm}}}]
      ports: [{protocol: TCP, port: 4000}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: neo4j-flows}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: neo4j}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{podSelector: {matchLabels: {app.kubernetes.io/name: graphiti-memory}}}]
      ports: [{protocol: TCP, port: 7687}]
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: memory-embedding-flows}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: memory-embedding}}
  policyTypes: [Ingress, Egress]
  ingress:
    - from: [{podSelector: {matchLabels: {app.kubernetes.io/name: graphiti-memory}}}]
      ports: [{protocol: TCP, port: 8080}]
  egress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: service-tools-memory-egress}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: service-tools}}
  policyTypes: [Egress]
  egress:
    - to: [{podSelector: {matchLabels: {app.kubernetes.io/name: graphiti-memory}}}]
      ports: [{protocol: TCP, port: 8000}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: litellm-memory-ingress}
spec:
  podSelector: {matchLabels: {app.kubernetes.io/name: litellm}}
  policyTypes: [Ingress]
  ingress:
    - from: [{podSelector: {matchLabels: {app.kubernetes.io/name: graphiti-memory}}}]
      ports: [{protocol: TCP, port: 4000}]
