apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  annotations:
    workstation.ai/qualification: pending-assistant-native-ui-rag-image-search-and-capacity
spec:
  template:
    spec:
      volumes:
        - name: webui-config-pins
          configMap: {name: webui-config-pins}
      containers:
        - name: open-webui
          # Admin Panel settings persist (persistent config). Before Open WebUI starts,
          # pin-config.py re-applies the settings this deployment sets, named in
          # WEBUI_PINNED_ENV by lib/workstation/service.py: connections and keys, sign-up,
          # default role and permissions, the reviewed RAG profile, model defaults. Those
          # stay owned by the deployment; every other setting is kept from the Admin Panel.
          command: [bash, -c]
          args: ["python3 -I /webui-pins/pin-config.py && exec bash start.sh"]
          workingDir: /app/backend
          volumeMounts:
            - {name: webui-config-pins, mountPath: /webui-pins, readOnly: true}
          env:
            # Explicit values override both upstream defaults and envFrom (the RAG
            # profile's init-container check still sees its own ENABLE_PERSISTENT_CONFIG=false).
            - {name: WEBUI_NAME, value: Family AI}
            - {name: ENABLE_PERSISTENT_CONFIG, value: 'true'}
            - {name: ENABLE_SIGNUP, value: 'false'}
            - {name: DEFAULT_MODEL_PARAMS, value: '{"function_calling":"native"}'}
            - {name: ENABLE_WEB_SEARCH, value: 'true'}
            - {name: ENABLE_WEB_SEARCH_CONFIRMATION, value: 'true'}
            - {name: WEB_SEARCH_ENGINE, value: external}
            - {name: EXTERNAL_WEB_SEARCH_URL, value: 'http://service-tools:8000/webui/search'}
            - name: EXTERNAL_WEB_SEARCH_API_KEY
              valueFrom:
                secretKeyRef: {name: webui-gateway-connection, key: service-key}
            - {name: WEB_LOADER_ENGINE, value: external}
            - {name: EXTERNAL_WEB_LOADER_URL, value: 'http://service-tools:8000/webui/fetch'}
            - name: EXTERNAL_WEB_LOADER_API_KEY
              valueFrom:
                secretKeyRef: {name: webui-gateway-connection, key: service-key}
            - {name: WEB_SEARCH_RESULT_COUNT, value: '3'}
            - {name: WEB_SEARCH_CONCURRENT_REQUESTS, value: '1'}
            - {name: WEB_LOADER_CONCURRENT_REQUESTS, value: '1'}
            # Public results are transient prompt evidence. Local knowledge
            # remains the existing authenticated RAG collection.
            - {name: BYPASS_WEB_SEARCH_EMBEDDING_AND_RETRIEVAL, value: 'true'}
            # Native MCP tool server with per-user identity: auth_type "session"
            # forwards the signed-in user's own WebUI token, which service-tools
            # checks like a coding client's key (role user; admins refused).
            # No shared credential. The public read grant only shows the server
            # in the tool menu; every call is authorised per user downstream.
            # Existing open-webui -> service-tools:8000 policies cover the flow.
            - name: TOOL_SERVER_CONNECTIONS
              value: >-
                [{"type":"mcp","url":"http://service-tools:8000/mcp","path":"","auth_type":"session",
                "key":"","config":{"enable":true,"access_grants":[{"principal_type":"user",
                "principal_id":"*","permission":"read"}]},"info":{"id":"workstation",
                "name":"Workstation tools","description":"Project passages, task handoffs, memory and
                public web pages, with your own permissions"}}]
            - {name: ENABLE_IMAGE_PROMPT_GENERATION, value: 'false'}
            - {name: AUDIO_TTS_ENGINE, value: ''}
            - {name: AUDIO_STT_OPENAI_API_BASE_URL, value: ''}
            - {name: AUDIO_TTS_OPENAI_API_BASE_URL, value: ''}
