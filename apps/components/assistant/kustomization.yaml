apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources: [network-policy.yaml]
images:
  # Release/source b0e6098e940942281d9c83f3529ea117287a3a22; Linux amd64.
  - name: ghcr.io/open-webui/open-webui
    newTag: v0.13.3
    digest: sha256:e731360d9e6eeb25482d90cf3d564ce81a1c4a10e6a84ed9e6c63aa7ac48b0b6
configMapGenerator:
  - name: webui-assistant-profile
    envs: [assistant.env]
patches:
  - path: webui.yaml
  - path: tools.yaml
  - target: {kind: Deployment, name: open-webui}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/envFrom/-
        value:
          configMapRef: {name: webui-assistant-profile}
