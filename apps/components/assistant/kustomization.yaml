apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources: [network-policy.yaml]
images:
  # Open WebUI 0.13.3 from the workstation fork (provider-declared Model Controls), built,
  # scanned and signed by the webui AI-stack stage from 21bc3e3da87d25e988b412710bafcefd4b4261db.
  - name: registry.lan.thespry.family/local/open-webui
    newTag: 2f743ea641c7
    digest: sha256:ec62ad7e6610614f48846889a0ebf7fa1586043f3d40bef1e0441d2e10ed7560
configMapGenerator:
  - name: webui-assistant-profile
    envs: [assistant.env]
  - name: webui-config-pins
    files: [pin-config.py]
patches:
  - path: webui.yaml
  - path: tools.yaml
  - target: {kind: Deployment, name: open-webui}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/envFrom/-
        value:
          configMapRef: {name: webui-assistant-profile}
