apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources: [network-policy.yaml]
images:
  # Open WebUI 0.13.3 from the workstation fork (provider-declared Model Controls, OpenMettle theme), built,
  # scanned and signed by the webui AI-stack stage from e42bed1d97fe8066340ec6eb3542ae5510e67fae.
  - name: registry.lan.thespry.family/local/open-webui
    newTag: ae0a56a00c2d
    digest: sha256:a4249f6de80af53ab11192d8994db06898b4fe469cc054ee7958f61604913dfa
configMapGenerator:
  - name: webui-assistant-profile
    envs: [assistant.env]
  # pin-config.py and the tool-use system prompt it writes to the default model's record.
  - name: webui-config-pins
    files: [pin-config.py, system-prompt.md]
  # OpenMettle palette for the whole app (theme/README.md). The icons come from the fork's
  # branding switch (OPENMETTLE_BRANDING in webui.yaml), not from this ConfigMap.
  - name: webui-theme
    files:
      - theme/custom.css
patches:
  - path: webui.yaml
  - path: tools.yaml
  - target: {kind: Deployment, name: open-webui}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/envFrom/-
        value:
          configMapRef: {name: webui-assistant-profile}
