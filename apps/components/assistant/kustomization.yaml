apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources: [network-policy.yaml]
images:
  # Open WebUI 0.13.3 from the workstation fork (provider-declared Model Controls, OpenMettle theme), built,
  # scanned and signed by the webui AI-stack stage from fa1bf005570bce1db7eeb1202f45d98c3cdccae4.
  - name: registry.lan.thespry.family/local/open-webui
    newTag: c75701350acc
    digest: sha256:bd4e2abc0cb6a95e8910d764fa2d897a32d07d1bf63492950f6a0e00ec8f37ab
configMapGenerator:
  - name: webui-assistant-profile
    envs: [assistant.env]
  # pin-config.py and the tool-use system prompt it writes to the default model's record.
  - name: webui-config-pins
    files: [pin-config.py, system-prompt.md]
  # Family AI theme (theme/README.md): stylesheet, app manifest and icons rendered
  # from theme/logo.svg. Binary files become binaryData; the total stays well under 1 MiB.
  - name: webui-theme
    files:
      - theme/custom.css
      - theme/site.webmanifest
      - theme/favicon.svg
      - theme/favicon.ico
      - theme/favicon.png
      - theme/favicon-96x96.png
      - theme/apple-touch-icon.png
      - theme/web-app-manifest-192x192.png
      - theme/web-app-manifest-512x512.png
      - theme/logo.png
      - theme/splash.png
      - theme/splash-dark.png
patches:
  - path: webui.yaml
  - path: tools.yaml
  - target: {kind: Deployment, name: open-webui}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/envFrom/-
        value:
          configMapRef: {name: webui-assistant-profile}
