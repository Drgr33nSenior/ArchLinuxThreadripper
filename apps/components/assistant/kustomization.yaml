apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources: [network-policy.yaml]
images:
  # Open WebUI 0.13.3 from the workstation fork (provider-declared Model Controls), built,
  # scanned and signed by the webui AI-stack stage from 21bc3e3da87d25e988b412710bafcefd4b4261db.
  - name: registry.lan.thespry.family/local/open-webui
    newTag: 2f743ea641c7
    digest: sha256:ec62ad7e6610614f48846889a0ebf7fa1586043f3d40bef1e0441d2e10ed7560
configMapGenerator:
  - name: webui-assistant-profile
    envs: [assistant.env]
  - name: webui-config-pins
    files: [pin-config.py]
  # Family AI theme (theme/README.md): stylesheet, app manifest and icons rendered
  # from theme/logo.svg. Binary files become binaryData; the total stays well under 1 MiB.
  - name: webui-theme
    files:
      - theme/custom.css
      - theme/site.webmanifest
      - theme/favicon.svg
      - theme/favicon.ico
      - theme/favicon.png
      - theme/favicon-96x96.png
      - theme/apple-touch-icon.png
      - theme/web-app-manifest-192x192.png
      - theme/web-app-manifest-512x512.png
      - theme/logo.png
      - theme/splash.png
      - theme/splash-dark.png
patches:
  - path: webui.yaml
  - path: tools.yaml
  - target: {kind: Deployment, name: open-webui}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/envFrom/-
        value:
          configMapRef: {name: webui-assistant-profile}
