apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
resources: [network-policy.yaml]
images:
  # Release/source f7ac7ee10962ddec0017f5c29b6740d9b9c5faca; Linux amd64.
  - name: ghcr.io/open-webui/open-webui
    newTag: v0.12.5
    digest: sha256:0caf3d68199bcd8b7051775778691dfa5f3c8a355d1d6484000171b2974f40f9
configMapGenerator:
  - name: webui-assistant-profile
    envs: [assistant.env]
patches:
  - path: webui.yaml
  - path: tools.yaml
  - target: {kind: Deployment, name: open-webui}
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/envFrom/-
        value:
          configMapRef: {name: webui-assistant-profile}
