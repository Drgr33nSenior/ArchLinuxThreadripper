apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai-home-lab
resources: [../../base, ingress.yaml]
configMapGenerator:
  - name: home-lab-site
    literals:
      - STORAGE_CLASS=local-path
      - WEBUI_HOST=ai.example.invalid
      - TLS_SECRET=ai-home-lab-tls
replacements:
  - source: {kind: ConfigMap, name: home-lab-site, fieldPath: data.STORAGE_CLASS}
    targets:
      - select: {kind: PersistentVolumeClaim}
        fieldPaths: [spec.storageClassName]
  - source: {kind: ConfigMap, name: home-lab-site, fieldPath: data.WEBUI_HOST}
    targets:
      - select: {kind: Ingress, name: open-webui}
        fieldPaths: [spec.rules.0.host, spec.tls.0.hosts.0]
  - source: {kind: ConfigMap, name: home-lab-site, fieldPath: data.TLS_SECRET}
    targets:
      - select: {kind: Ingress, name: open-webui}
        fieldPaths: [spec.tls.0.secretName]
