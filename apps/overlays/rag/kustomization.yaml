apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai-home-lab
resources: [../dual-gpu, pvc.yaml]
patches:
  - path: webui.yaml
images:
  - name: registry.invalid/ai-home-lab/open-webui
    newName: ghcr.io/open-webui/open-webui
    newTag: v0.11.4
    digest: sha256:332438e079ad23bb11b0ab278b43e7c98b50e8cec14b0840281644e8a289f49f
configMapGenerator:
  - name: webui-rag-profile
    envs: [rag.env]
  - name: webui-rag-inputs
    files: [SHA256SUMS, RERANKER-SHA256SUMS, verify-models.sh, validate-profile.sh, check-reranker.py]
