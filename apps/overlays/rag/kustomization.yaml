apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai-home-lab
resources: [../dual-gpu, pvc.yaml]
patches:
  - path: webui.yaml
images:
  - name: registry.invalid/ai-home-lab/open-webui
    newName: registry.lan.thespry.family/local/open-webui
    newTag: 0d02ef9cdebe
    digest: sha256:e53f34d99004ffa3d33938b8f88f70824ba471cb13de23cd53dcf6aa65a7e462
configMapGenerator:
  - name: webui-rag-profile
    envs: [rag.env]
  - name: webui-rag-inputs
    files: [SHA256SUMS, RERANKER-SHA256SUMS, WHISPER-SHA256SUMS, verify-models.sh, validate-profile.sh, check-reranker.py]
