apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai-home-lab
resources: [../dual-gpu, pvc.yaml]
patches:
  - path: webui.yaml
images:
  - name: registry.invalid/ai-home-lab/open-webui
    newName: ghcr.io/open-webui/open-webui
    newTag: v0.13.3
    digest: sha256:e731360d9e6eeb25482d90cf3d564ce81a1c4a10e6a84ed9e6c63aa7ac48b0b6
configMapGenerator:
  - name: webui-rag-profile
    envs: [rag.env]
  - name: webui-rag-inputs
    files: [SHA256SUMS, RERANKER-SHA256SUMS, WHISPER-SHA256SUMS, verify-models.sh, validate-profile.sh, check-reranker.py]
