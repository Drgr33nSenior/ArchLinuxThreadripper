apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai-home-lab
resources: [../rag, ../../base/shared-api, ingress.yaml]
patches:
  - path: webui.yaml
  - target: {kind: NetworkPolicy, name: webui-to-sglang}
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata: {name: webui-to-sglang}
  - target: {kind: NetworkPolicy, name: sglang-from-webui}
    patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata: {name: sglang-from-webui}
  - target: {kind: PersistentVolumeClaim, name: 'gateway-postgres|service-tools-state'}
    patch: |-
      - op: replace
        path: /spec/storageClassName
        value: workstation-retain
# The site renderer replaces inherited hosts/TLS and storage classes AFTER all
# inherited replacements. Existing bound PVCs need the explicit Retain migration.
