apiVersion: apps/v1
kind: Deployment
metadata: {name: open-webui}
spec:
  template:
    spec:
      containers:
        - name: open-webui
          env:
            - {name: OPENAI_API_BASE_URL, value: 'http://litellm:4000/webui/v1'}
            - name: OPENAI_API_KEY
              value: null
              valueFrom:
                secretKeyRef: {name: webui-gateway-connection, key: service-key}
            - {name: ENABLE_FORWARD_USER_INFO_HEADERS, value: 'true'}
            - {name: ENABLE_DIRECT_CONNECTIONS, value: 'false'}
            - {name: ENABLE_API_KEYS, value: 'true'}
            # Users (not only admins) may create API keys: service-tools refuses admin
            # credentials, so coding clients need a user-role key (default is off).
            - {name: USER_PERMISSIONS_FEATURES_API_KEYS, value: 'true'}
            - {name: ENABLE_API_KEYS_ENDPOINT_RESTRICTIONS, value: 'true'}
            # '/api/v1/knowledge/' (trailing slash) matches only the read-only
            # knowledge listing, the project authority for handoffs and project
            # memory; it does not admit /api/v1/knowledge/<id>/... write routes.
            # /api/v1/users/user/status (exact path) is service-tools' caller
            # identity check; ENABLE_USER_STATUS keeps it available.
            # The JetBrains ACP agent (Drgr33nSenior/openwebui-acp-agent) with the user's
            # own key: /api/models and /api/chat/completions for chat (/api/models also
            # admits /base and /unload, which are admin-only). Its server-tools mode:
            # /api/version and /api/config (exact), /api/v1/tools/ (the listing only, not
            # create/update/delete), /api/tasks/chat (poll/stop/resume the caller's own
            # task) and /api/v1/chats. That last one must be a prefix to reach
            # /api/v1/chats/{id}, so a key can do anything its owner can do to their own
            # chats, including deleting them all; the allowlist cannot restrict methods.
            - name: API_KEYS_ALLOWED_ENDPOINTS
              value: >-
                /api/v1/users/user/status,/api/v1/retrieval/query/collection,/api/v1/files,/api/v1/knowledge/,/api/models,/api/chat/completions,/api/version,/api/config,/api/v1/tools/,/api/v1/chats,/api/tasks/chat
            - {name: ENABLE_USER_STATUS, value: 'true'}
            - {name: ENABLE_IMAGE_GENERATION, value: 'true'}
            - {name: IMAGE_GENERATION_ENGINE, value: openai}
            - {name: IMAGES_OPENAI_API_BASE_URL, value: 'http://service-tools:8000/webui'}
            - name: IMAGES_OPENAI_API_KEY
              valueFrom:
                secretKeyRef: {name: webui-gateway-connection, key: service-key}
            - {name: IMAGE_GENERATION_MODEL, value: workstation-qwen-image}
            - {name: IMAGE_SIZE, value: 1328x1328}
            - {name: ENABLE_IMAGE_EDIT, value: 'false'}
            - {name: ENABLE_COMMUNITY_SHARING, value: 'false'}
            - {name: ENABLE_EVALUATION_ARENA_MODELS, value: 'false'}
