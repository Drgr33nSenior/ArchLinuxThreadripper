apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shared-model-api
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: 'true'
    traefik.ingress.kubernetes.io/router.middlewares: ai-home-lab-client-boundary@kubernetescrd
spec:
  ingressClassName: traefik
  tls: [{hosts: [api.example.invalid], secretName: ai-home-lab-tls}]
  rules:
    - host: api.example.invalid
      http:
        paths:
          - path: /v1/chat/completions
            pathType: Exact
            backend: {service: {name: litellm, port: {name: http}}}
          - path: /v1/models
            pathType: Exact
            backend: {service: {name: litellm, port: {name: http}}}
          - path: /_service/status
            pathType: Exact
            backend: {service: {name: litellm, port: {name: http}}}
          - path: /mcp
            pathType: Exact
            backend: {service: {name: service-tools, port: {name: http}}}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: {name: client-boundary}
spec:
  headers:
    customRequestHeaders:
      X-OpenWebUI-User-Id: ''
      X-OpenWebUI-User-Name: ''
      X-OpenWebUI-User-Email: ''
      X-OpenWebUI-User-Role: ''
      X-OpenWebUI-User-Jwt: ''
      X-OpenWebUI-Chat-Id: ''
      X-OpenWebUI-Message-Id: ''
      X-LiteLLM-Api-Key: ''
  # Browser origin is not a credential. No permissive cross-origin policy.
