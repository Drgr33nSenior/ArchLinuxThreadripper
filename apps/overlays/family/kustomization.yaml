apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../single-gpu, ../parent, ../kids]
replacements:
  - source: {kind: ConfigMap, name: home-lab-site, fieldPath: data.STORAGE_CLASS}
    targets:
      - select: {kind: PersistentVolumeClaim}
        fieldPaths: [spec.storageClassName]
# No security-policy exception: gaming stays disabled pending an explicit
# namespace/admission decision, image qualification and input-device handling.
