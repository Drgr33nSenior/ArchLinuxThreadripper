# Shared mode: the two-GPU contract model (serving arm UQS, render with
# `service render --mode shared --serving-profile ... --arm UQS`) plus image
# generation in the VRAM it leaves free on both cards: SwarmUI with its self-started
# ComfyUI on gpu-1 and a second ComfyUI on gpu-0 (apps/base/comfyui-gpu0). The large
# assistant's budgets apply; only images are added.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ai-home-lab
resources: [../assistant, ../../base/comfyui-gpu0]
patches:
  - target: {kind: Deployment, name: open-webui}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: open-webui}
      spec:
        template:
          spec:
            containers:
              - name: open-webui
                env:
                  - {name: ENABLE_IMAGE_GENERATION, value: 'true'}
  # One picture per card at a time: SwarmUI sends each request to an idle backend.
  - target: {kind: Deployment, name: service-tools}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: service-tools}
      spec:
        template:
          spec:
            containers:
              - name: tools
                env:
                  - {name: IMAGE_CONCURRENCY, value: '2'}
                  # Short videos (generate_video, video.py) on comfyui-gpu0, which holds the Wan stack.
                  - {name: VIDEO_ENABLED, value: 'true'}
  # Session admission: `session switch shared` starts only Deployments marked qualified.
  # Both generators have run in shared mode since 2026-11-11: SDXL 1024x1024 warm 6.6 s
  # (gpu-1) and 7.2 s (gpu-0) beside the UQS arm, and Wan 2.2 video on comfyui-gpu0 since
  # 2026-11-12 (docs/ASSISTANT.md, short videos). Marked here, not in apps/base, so the
  # split and older overlays keep their own pending status.
  - target: {kind: Deployment, name: swarmui}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: swarmui
        annotations: {workstation.ai/qualification: qualified}
  - target: {kind: Deployment, name: comfyui-gpu0}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: comfyui-gpu0
        annotations: {workstation.ai/qualification: qualified}
