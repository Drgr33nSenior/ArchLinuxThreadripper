services:
  gateway-postgres:
    image: docker.io/library/postgres:18.6-bookworm@sha256:6b38fe68f2c02cafffbbce7496f76d110d8a947c039bd22c067e9a43c2250240
    user: '999:999'
    environment:
      POSTGRES_PASSWORD_FILE: /run/postgres/admin-password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=peer
    volumes:
      - pgdata:/var/lib/postgresql
      - ${SMOKE_DIRECTORY}/secrets:/run/postgres:ro
      - ../../apps/base/shared-api/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    tmpfs: ['/var/run/postgresql:uid=999,gid=999']
    healthcheck: {test: [CMD, pg_isready, -U, postgres], interval: 2s, retries: 60}
    mem_limit: 1g
    cpus: 1
  sglang:
    image: ghcr.io/berriai/litellm:v1.106.2@sha256:d1da6edc025e6a59be6faa50b4e8e42c115e1c99644aa3fc2ac416dd353f41da
    user: '1000:1000'
    entrypoint: [python, -m, uvicorn, 'fixture_backend:app', --app-dir, /fixture, --host, 0.0.0.0, --port, '30000', --no-access-log]
    volumes: ['./:/fixture:ro']
    mem_limit: 512m
    cpus: 1
  gateway:
    image: ghcr.io/berriai/litellm:v1.106.2@sha256:d1da6edc025e6a59be6faa50b4e8e42c115e1c99644aa3fc2ac416dd353f41da
    user: '1000:1000'
    entrypoint: [python, -m, uvicorn, 'gateway_entry:app', --app-dir, /runtime, --host, 0.0.0.0, --port, '4000', --workers, '1', --no-access-log, --log-level, error]
    environment: {HOME: /tmp, DISABLE_SCHEMA_UPDATE: 'true'}
    volumes:
      - ../../apps/base/shared-api:/runtime:ro
      - ../../apps/base/shared-api:/config:ro
      - ${SMOKE_DIRECTORY}/secrets:/run/gateway:ro
      - ${SMOKE_DIRECTORY}/secrets:/run/browser:ro
    tmpfs: ['/tmp:uid=1000,gid=1000']
    mem_limit: 2g
    cpus: 1
  client:
    image: ghcr.io/berriai/litellm:v1.106.2@sha256:d1da6edc025e6a59be6faa50b4e8e42c115e1c99644aa3fc2ac416dd353f41da
    entrypoint: [python, /fixture/native_client.py]
    volumes:
      - ./:/fixture:ro
      - ${SMOKE_DIRECTORY}/secrets:/run/fixture:ro
      - ${SMOKE_DIRECTORY}/state:/state
    mem_limit: 512m
    cpus: 1
# No published ports, host socket, GPU, kubeconfig or privileged containers.
# Persistence here is across process restarts. Real PVC/DR acceptance is separate.
volumes:
  pgdata:
