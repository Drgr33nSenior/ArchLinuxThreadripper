name: Workstation source checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.11.17'}
      - name: Distribution prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y jq ripgrep ruby libarchive-tools build-essential unzip nftables python-is-python3 libxml2-utils restic man-db
          xmllint --version
          man --where restic
          mkdir -p test-results/ci
          dpkg-query -W > test-results/ci/distribution-packages.txt
      - name: Pinned validation environment
        run: |
          python -m venv "$RUNNER_TEMP/workstation-validation"
          "$RUNNER_TEMP/workstation-validation/bin/python" -m pip --isolated install --require-hashes --only-binary=:all: -r tests/validation-service.lock
          bash tests/ci/prepare-tools.sh "$RUNNER_TEMP/workstation-tools"
          echo "$RUNNER_TEMP/workstation-validation/bin" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/workstation-tools/bin" >> "$GITHUB_PATH"
          echo "HOME_LAB_PYTHON=$RUNNER_TEMP/workstation-validation/bin/python" >> "$GITHUB_ENV"
          echo "HOME_LAB_GPU_CHART=$RUNNER_TEMP/workstation-tools/gpu-chart.tgz" >> "$GITHUB_ENV"
      - name: Stage real executables for systemd source verification
        # Ephemeral hosted runner only. No unit is started or enabled.
        run: |
          sudo install -Dm755 templates/workstation/restic/workstation-restic /usr/lib/arch-workstation-backup/run
          sudo install -Dm755 "$RUNNER_TEMP/workstation-tools/bin/grafana-alloy" /usr/bin/grafana-alloy
      - name: Required strict checks
        # setup-python exports both variables on Linux. The ROCm fixtures require
        # an unmodified compiler search environment; their rejection guard stays on.
        run: env -u LD_LIBRARY_PATH -u PKG_CONFIG_PATH make check-strict
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: source-check-evidence
          path: |
            test-results/strict-check.*/check.log
            test-results/strict-check.*/make.exit
            test-results/strict-check.*/skips.txt
            test-results/ci/distribution-packages.txt
          retention-days: 7
          if-no-files-found: error
  # Native gateway/database tests use disposable hosted runners only. Never
  # attach the workstation, kubeconfig, deployment identity, NAS or production keys.
  gateway-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {persist-credentials: false}
      - name: Native gateway and database smoke
        run: timeout --kill-after=90s 17m bash tests/service/native-smoke.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: native-gateway-evidence
          # Only fixed phase results and allowlisted container metadata. Raw
          # process logs, fixture keys and database state stay outside artifacts.
          path: |
            test-results/native-service.*/summary.tsv
            test-results/native-service.*/containers.tsv
          retention-days: 7
          if-no-files-found: error
